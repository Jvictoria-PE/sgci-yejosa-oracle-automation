name: Oracle preflight (read only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-preflight
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install OCI SDK
        run: python -m pip install --disable-pip-version-check 'oci>=2.130,<3'
      - name: Inspect existing Oracle jobs and compute resources
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_STACK_OCID: ${{ secrets.OCI_STACK_OCID }}
        run: python oracle-preflight.py
