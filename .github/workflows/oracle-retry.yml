name: Oracle Always Free capacity retry

on:
  workflow_dispatch:
  schedule:
    # GitHub schedules are best-effort, and may be delayed or skipped.
    - cron: '7,37 * * * *'

permissions:
  contents: read

concurrency:
  group: oracle-always-free-capacity-retry
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out pinned repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install OCI Python SDK
        run: python -m pip install --disable-pip-version-check 'oci==2.191.0'

      - name: Attempt only the previously approved Terraform plan when safe
        env:
          OCI_USER_OCID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
          OCI_STACK_OCID: ${{ secrets.OCI_STACK_OCID }}
        run: python oracle-retry.py
